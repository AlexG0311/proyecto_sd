networks:
  red_externa:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
  red_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
  red_interna:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24

services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    networks:
      red_externa:
        ipv4_address: 192.168.0.2
      red_dmz:
        ipv4_address: 192.168.1.2
    volumes:
      - ./servicios/dns/config/named.conf:/etc/bind/named.conf
      - ./servicios/dns/zones:/etc/bind/zones
      - ./servicios/dns/data:/var/bind
    environment:
      - BIND9_USER=root
    entrypoint: /usr/sbin/named -g -c /etc/bind/named.conf

  firewall:
    build: ./servicios/firewall
    container_name: firewall
    privileged: true
    networks:
      red_externa:
        ipv4_address: 192.168.0.10
      red_dmz:
        ipv4_address: 192.168.1.10
      red_interna:
        ipv4_address: 192.168.2.10
    cap_add:
      - NET_ADMIN
      - NET_RAW

  proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    networks:
      red_dmz:
        ipv4_address: 192.168.1.5
    volumes:
      - ./servicios/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - firewall
      - dns

  balanceador_a:
    image: haproxy:latest
    container_name: balanceador_a
    networks:
      red_dmz:
        ipv4_address: 192.168.1.6
    volumes:
      - ./servicios/balanceador_a/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_a1
      - suitecrm_a2

  balanceador_b:
    image: haproxy:latest
    container_name: balanceador_b
    networks:
      red_dmz:
        ipv4_address: 192.168.1.7
    volumes:
      - ./servicios/balanceador_b/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_b1
      - suitecrm_b2

  # CLIENTE A
  suitecrm_a1:
    image: suitecrm:7.15
    container_name: suitecrm_a1
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.11
      red_interna:
        ipv4_address: 192.168.2.11
    environment:
      - DB_HOST=proxysql
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - ./servicios/suitecrm/config_a/config.php:/var/www/html/config.php
    depends_on:
      - dns
      - firewall
      - proxysql

  suitecrm_a2:
    image: suitecrm:7.15
    container_name: suitecrm_a2
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.12
      red_interna:
        ipv4_address: 192.168.2.12
    environment:
      - DB_HOST=proxysql
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - ./servicios/suitecrm/config_a/config.php:/var/www/html/config.php
    depends_on:
      - dns
      - firewall
      - proxysql

  suitecrm_b1:
    image: suitecrm:7.15
    container_name: suitecrm_b1
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.13
      red_interna:
        ipv4_address: 192.168.2.13
    environment:
      - DB_HOST=proxysql
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - ./servicios/suitecrm/config_b/config.php:/var/www/html/config.php
    depends_on:
      - dns
      - firewall
      - proxysql

  suitecrm_b2:
    image: suitecrm:7.15
    container_name: suitecrm_b2
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.14
      red_interna:
        ipv4_address: 192.168.2.14
    environment:
      - DB_HOST=proxysql
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - ./servicios/suitecrm/config_b/config.php:/var/www/html/config.php
    depends_on:
      - dns
      - firewall
      - proxysql

  productor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: productor
    networks:
      red_interna:
        ipv4_address: 192.168.2.21
    command: python -u productor.py
    depends_on:
      - rabbitmq
      - proxysql
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - DB_HOST=proxysql
      - DB_PORT=3306
      - DB_USER=suitecrm_user
      - DB_PASS=secret
      - DB_NAME=suitecrm_a

  # BROKER DE MENSAJERÍA
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      red_interna:
        ipv4_address: 192.168.2.20
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  # CLÚSTER DE BASE DE DATOS
  db_master:
    image: mariadb:10.6
    container_name: db_master
    networks:
      red_interna:
        ipv4_address: 192.168.2.30
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/db_master:/var/lib/mysql
      - ./servicios/db/init_master.sql:/docker-entrypoint-initdb.d/init.sql
    command: --server-id=1 --log-bin=mysql-bin --binlog-format=row

  db_slave1:
    image: mariadb:10.6
    container_name: db_slave1
    networks:
      red_interna:
        ipv4_address: 192.168.2.31
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/db_slave1:/var/lib/mysql
    command: --server-id=2 --log-bin=mysql-bin --binlog-format=row --read-only=1
    depends_on:
      - db_master

  db_slave2:
    image: mariadb:10.6
    container_name: db_slave2
    networks:
      red_interna:
        ipv4_address: 192.168.2.32
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/db_slave2:/var/lib/mysql
    command: --server-id=3 --log-bin=mysql-bin --binlog-format=row --read-only=1
    depends_on:
      - db_master

  proxysql:
    image: proxysql/proxysql:2.5.5
    container_name: proxysql
    networks:
      red_interna:
        ipv4_address: 192.168.2.33
    volumes:
      - ./servicios/proxysql/proxysql.cnf:/etc/proxysql.cnf
    depends_on:
      - db_master
      - db_slave1
      - db_slave2

  productor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: productor
    networks:
      red_interna:
        ipv4_address: 192.168.2.21
    command: python -u productor.py
    depends_on:
      - rabbitmq
      - proxysql
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - DB_HOST=proxysql
      - DB_PORT=6033
      - DB_USER=suitecrm_user
      - DB_PASS=secret
      - DB_NAME=suitecrm_a

  consumidor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: consumidor
    networks:
      red_interna:
        ipv4_address: 192.168.2.22
    command: python -u consumidor.py
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123