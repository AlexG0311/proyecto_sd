networks:
  red_externa:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
  red_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
  red_interna:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24

services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    networks:
      red_externa:
        ipv4_address: 192.168.0.2
      red_dmz:
        ipv4_address: 192.168.1.2
    volumes:
      - ./servicios/dns/config/named.conf:/etc/bind/named.conf
      - ./servicios/dns/zones:/etc/bind/zones
      - ./servicios/dns/data:/var/bind
    environment:
      - BIND9_USER=root
    entrypoint: /usr/sbin/named -g -c /etc/bind/named.conf

  firewall:
    build: ./servicios/firewall
    container_name: firewall
    privileged: true
    networks:
      red_externa:
        ipv4_address: 192.168.0.10
      red_dmz:
        ipv4_address: 192.168.1.10
      red_interna:
        ipv4_address: 192.168.2.10
    cap_add:
      - NET_ADMIN
      - NET_RAW

  proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    networks:
      red_dmz:
        ipv4_address: 192.168.1.5
    volumes:
      - ./servicios/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - firewall
      - dns

  balanceador_a:
    image: haproxy:latest
    container_name: balanceador_a
    networks:
      red_dmz:
        ipv4_address: 192.168.1.6
    volumes:
      - ./servicios/balanceador_a/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_a1
      - suitecrm_a2

  balanceador_b:
    image: haproxy:latest
    container_name: balanceador_b
    networks:
      red_dmz:
        ipv4_address: 192.168.1.7
    volumes:
      - ./servicios/balanceador_b/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_b1
      - suitecrm_b2

  # CLIENTE A
  suitecrm_a1:
    image: suitecrm:7.15
    container_name: suitecrm_a1
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.11
      red_interna:
        ipv4_address: 192.168.2.11
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_a_data:/var/www/html
    depends_on:
      - dns
      - firewall
      - db_haproxy

  suitecrm_a2:
    image: suitecrm:7.15
    container_name: suitecrm_a2
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.12
      red_interna:
        ipv4_address: 192.168.2.12
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_a_data:/var/www/html
    depends_on:
      - dns
      - firewall
      - db_haproxy

  suitecrm_b1:
    image: suitecrm:7.15
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.13
      red_interna:
        ipv4_address: 192.168.2.13
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_b_data:/var/www/html
    depends_on:
      - dns
      - firewall
      - db_haproxy

  suitecrm_b2:
    image: suitecrm:7.15
    command: apache2-foreground
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.14
      red_interna:
        ipv4_address: 192.168.2.14
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_b_data:/var/www/html
    depends_on:
      - dns
      - firewall
      - db_haproxy

  # BROKER DE MENSAJERÍA
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      red_interna:
        ipv4_address: 192.168.2.20
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

   # ========== CLÚSTER GALERA (3 NODOS) ==========
  galera1:
    image: mariadb:11.4
    container_name: galera1
    hostname: galera1
    networks:
      red_interna:
        ipv4_address: 192.168.2.30
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/galera1:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["mariadbd", "--wsrep-new-cluster", "--wsrep-node-name=galera1", "--wsrep-node-address=galera1"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  galera2:
    image: mariadb:11.4
    container_name: galera2
    hostname: galera2
    networks:
      red_interna:
        ipv4_address: 192.168.2.31
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/galera2:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["mariadbd", "--wsrep-node-name=galera2", "--wsrep-node-address=galera2"]
    depends_on:
      - galera1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  galera3:
    image: mariadb:11.4
    container_name: galera3
    hostname: galera3
    networks:
      red_interna:
        ipv4_address: 192.168.2.32
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - ./data/galera3:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["mariadbd", "--wsrep-node-name=galera3", "--wsrep-node-address=galera3"]
    depends_on:
      - galera1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== BALANCEADOR TCP (HAProxy) ==========
  db_haproxy:
    image: haproxy:2.8
    container_name: db_haproxy
    networks:
      red_dmz:
        ipv4_address: 192.168.1.8
      red_interna:
        ipv4_address: 192.168.2.33
    ports:
      - "3306:3306"   # opcional, si quieres acceso externo
    volumes:
      - ./servicios/haproxy_db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - galera1
      - galera2
      - galera3
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    networks:
      red_dmz:
        ipv4_address: 192.168.1.9
      red_interna:
        ipv4_address: 192.168.2.34
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db_haproxy
    depends_on:
      - db_haproxy
    restart: unless-stopped  

  productor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: productor
    networks:
      red_interna:
        ipv4_address: 192.168.2.21
    command: python -u productor.py
    depends_on:
      - rabbitmq
      - db_haproxy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_USER=suitecrm_user
      - DB_PASS=secret
      - DB_NAME=suitecrm_a

  consumidor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: consumidor
    networks:
      red_interna:
        ipv4_address: 192.168.2.22
    command: python -u consumidor.py
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123

volumes:          # ← agrega esto
  suitecrm_a_data:
  suitecrm_b_data:

