networks:
  red_externa:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/24
  red_dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
  red_interna:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24

services:
  dns:
    image: internetsystemsconsortium/bind9:9.18
    container_name: dns
    ports:
      - "192.168.100.122:53:53/udp"
      - "192.168.100.122:53:53/tcp"
    networks:
      red_externa:
        ipv4_address: 192.168.0.2
      red_dmz:
        ipv4_address: 192.168.1.2
    volumes:
      - ./servicios/dns/config/named.conf:/etc/bind/named.conf
      - ./servicios/dns/zones:/etc/bind/zones
      - ./servicios/dns/data:/var/bind
    environment:
      - BIND9_USER=root
    entrypoint: /usr/sbin/named -g -c /etc/bind/named.conf

  firewall:
    build: ./servicios/firewall
    container_name: firewall
    ports:
      - "80:80"
    privileged: true
    networks:
      red_externa:
        ipv4_address: 192.168.0.10
      red_dmz:
        ipv4_address: 192.168.1.10
      red_interna:
        ipv4_address: 192.168.2.10
    cap_add:
      - NET_ADMIN
      - NET_RAW

  proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    networks:
      red_dmz:
        ipv4_address: 192.168.1.5
    volumes:
      - ./servicios/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - firewall
      - dns

  balanceador_a:
    image: haproxy:latest
    container_name: balanceador_a
    networks:
      red_dmz:
        ipv4_address: 192.168.1.6
    volumes:
      - ./servicios/balanceador_a/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_a1
      - suitecrm_a2

  balanceador_b:
    image: haproxy:latest
    container_name: balanceador_b
    networks:
      red_dmz:
        ipv4_address: 192.168.1.7
    volumes:
      - ./servicios/balanceador_b/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - suitecrm_b1
      - suitecrm_b2

  # ========== REDIS ==========
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      red_interna:
        ipv4_address: 192.168.2.40
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ========== CLIENTE A ==========
  suitecrm_a1:
    image: suitecrm:7.15
    container_name: suitecrm_a1
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.11
      red_interna:
        ipv4_address: 192.168.2.11
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_a_data:/var/www/html
      - suitecrm_a_upload:/var/www/html/upload
      - suitecrm_a_cache:/var/www/html/cache
    depends_on:
      - dns
      - firewall
      - db_haproxy
      - redis

  suitecrm_a2:
    image: suitecrm:7.15
    container_name: suitecrm_a2
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.12
      red_interna:
        ipv4_address: 192.168.2.12
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_a
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_a_data:/var/www/html
      - suitecrm_a_upload:/var/www/html/upload
      - suitecrm_a_cache:/var/www/html/cache
    depends_on:
      - dns
      - firewall
      - db_haproxy
      - redis

  # ========== CLIENTE B ==========
  suitecrm_b1:
    image: suitecrm:7.15
    container_name: suitecrm_b1
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.13
      red_interna:
        ipv4_address: 192.168.2.13
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_b_data:/var/www/html
      - suitecrm_b_upload:/var/www/html/upload
      - suitecrm_b_cache:/var/www/html/cache
    depends_on:
      - dns
      - firewall
      - db_haproxy
      - redis

  suitecrm_b2:
    image: suitecrm:7.15
    container_name: suitecrm_b2
    restart: unless-stopped
    networks:
      red_dmz:
        ipv4_address: 192.168.1.14
      red_interna:
        ipv4_address: 192.168.2.14
    environment:
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_NAME=suitecrm_b
      - DB_USER=suitecrm_user
      - DB_PASS=secret
    volumes:
      - suitecrm_b_data:/var/www/html
      - suitecrm_b_upload:/var/www/html/upload
      - suitecrm_b_cache:/var/www/html/cache
    depends_on:
      - dns
      - firewall
      - db_haproxy
      - redis

  # ========== BROKER ==========
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      red_interna:
        ipv4_address: 192.168.2.20
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  # ========== CLÚSTER GALERA ==========
  galera1:
    image: mariadb:11.4
    container_name: galera1
    hostname: galera1
    networks:
      red_interna:
        ipv4_address: 192.168.2.30
    environment:
      - MARIADB_ROOT_PASSWORD=rootpass
      - WSREP_NODE_NAME=galera1
      - WSREP_NODE_ADDRESS=galera1
      - WSREP_CLUSTER_NODES=galera1,galera2,galera3
    volumes:
      - ./data/galera1:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./servicios/galera/bootstrap.sh:/usr/local/bin/bootstrap.sh
    entrypoint: ["/usr/local/bin/bootstrap.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  galera2:
    image: mariadb:11.4
    container_name: galera2
    hostname: galera2
    networks:
      red_interna:
        ipv4_address: 192.168.2.31
    environment:
      - MARIADB_ROOT_PASSWORD=rootpass
      - WSREP_NODE_NAME=galera2
      - WSREP_NODE_ADDRESS=galera2
      - WSREP_CLUSTER_NODES=galera1,galera2,galera3
    volumes:
      - ./data/galera2:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./servicios/galera/bootstrap.sh:/usr/local/bin/bootstrap.sh
    entrypoint: ["/usr/local/bin/bootstrap.sh"]
    depends_on:
      - galera1
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  galera3:
    image: mariadb:11.4
    container_name: galera3
    hostname: galera3
    networks:
      red_interna:
        ipv4_address: 192.168.2.32
    environment:
      - MARIADB_ROOT_PASSWORD=rootpass
      - WSREP_NODE_NAME=galera3
      - WSREP_NODE_ADDRESS=galera3
      - WSREP_CLUSTER_NODES=galera1,galera2,galera3
    volumes:
      - ./data/galera3:/var/lib/mysql
      - ./servicios/galera/my.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./servicios/galera/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./servicios/galera/bootstrap.sh:/usr/local/bin/bootstrap.sh
    entrypoint: ["/usr/local/bin/bootstrap.sh"]
    depends_on:
      - galera1
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========== BALANCEADOR DB ==========
  db_haproxy:
    image: haproxy:2.8
    container_name: db_haproxy
    networks:
      red_dmz:
        ipv4_address: 192.168.1.8
      red_interna:
        ipv4_address: 192.168.2.33
    
    volumes:
      - ./servicios/haproxy_db/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - galera1
      - galera2
      - galera3
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer
    networks:
      red_dmz:
        ipv4_address: 192.168.1.9
      red_interna:
        ipv4_address: 192.168.2.34
    ports:
        - "8080:8080"
    
    environment:
      ADMINER_DEFAULT_SERVER: db_haproxy
    depends_on:
      - db_haproxy
    restart: unless-stopped

  productor_a:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: productor_a
    networks:
      red_interna:
        ipv4_address: 192.168.2.21
      red_dmz:
        ipv4_address: 192.168.1.23
    command: python -u productor.py
    depends_on:
      - rabbitmq
      - db_haproxy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_USER=suitecrm_user
      - DB_PASS=secret
      - DB_NAME=suitecrm_a
      
  productor_b:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: productor_b
    networks:
      red_interna:
        ipv4_address: 192.168.2.24    
    command: python -u productor.py
    depends_on:
      - rabbitmq
      - db_haproxy
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - DB_HOST=db_haproxy
      - DB_PORT=3306
      - DB_USER=suitecrm_user
      - DB_PASS=secret
      - DB_NAME=suitecrm_b         
    
  consumidor:
    build:
      context: .
      dockerfile: servicios/broker/Dockerfile
    container_name: consumidor
    networks:
      red_interna:
        ipv4_address: 192.168.2.22
      red_dmz:
        ipv4_address: 192.168.1.22
    command: python -u consumidor.py
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin123
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=alexdavidgonzalez2003@gmail.com
      - SMTP_PASS=fwllthqrukfwvcfg

volumes:
  suitecrm_a_data:
  suitecrm_a_upload:
  suitecrm_a_cache:
  suitecrm_b_data:
  suitecrm_b_upload:
  suitecrm_b_cache:
  redis_data: