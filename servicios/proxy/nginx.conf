events {
    worker_connections 1024;
}

http {
    upstream cliente_a {
        server 192.168.1.6:80;   # Balanceador de Cliente A (se creará después)
    }
    upstream cliente_b {
        server 192.168.1.7:80;   # Balanceador de Cliente B
    }

    server {
        listen 80;
        server_name clienteA.local www.clientea.local;

        location / {
            proxy_pass http://cliente_a;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name clienteB.local www.clienteb.local;

        location / {
            proxy_pass http://cliente_b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}	
