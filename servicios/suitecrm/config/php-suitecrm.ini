; Sesiones en Redis
session.save_handler = redis
session.save_path = "tcp://redis:6379"
session.gc_maxlifetime = 3600

; Memoria y límites
memory_limit = 256M
upload_max_filesize = 60M
post_max_size = 60M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; Seguridad
expose_php = Off

; Zona horaria
date.timezone = America/Bogota