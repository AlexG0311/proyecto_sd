global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend galera_front
    bind *:3306
    default_backend galera_backend

backend galera_backend
    balance roundrobin
    option mysql-check user monitor 
    server galera1 192.168.2.30:3306 check
    server galera2 192.168.2.31:3306 check
    server galera3 192.168.2.32:3306 check
