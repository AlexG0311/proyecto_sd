global
    log stdout format raw local0
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_front
    bind *:80
    default_backend suitecrm_servers

backend suitecrm_servers
    balance roundrobin
    option httpchk HEAD / HTTP/1.0
    server suitecrm_b1 suitecrm_b1:80 check
    server suitecrm_b2 suitecrm_b2:80 check
	
